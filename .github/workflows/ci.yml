name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run size

      # Prerender gerçekten prerender mı? JS'siz çıktıyı doğrula.
      - name: Verify static content (no-JS readability)
        run: |
          node -e "
          const fs=require('fs');
          const h=fs.readFileSync('dist/index.html','utf8');
          const probes=['Yatağın ayaklarını keserim','çene kemiğinden yükselir','BEN PRENSİP'];
          for (const p of probes) if(!h.includes(p)) { console.error('Eksik statik metin: '+p); process.exit(1); }
          if (h.includes('dangerouslySetInnerHTML')) { console.error('innerHTML kullanımı'); process.exit(1); }
          console.log('✓ manifesto statik HTML içinde');
          "

      # Statik HTML'deki her etkileşim düğümü gerçekten bir dinleyiciyle buluşuyor mu?
      # (Geçmişte data-copy butonları render ediliyor ama dinleyici hiç bağlanmıyordu:
      #  buton görünür, tıklanınca hiçbir şey olmuyordu — bkz. docs/DENETIM.md §B1.)
      #
      # Ölçüt BİLEREK "seçici literali": `data-copy` adı App.tsx'te JSX özniteliği olarak
      # da geçtiği için zayıf bir kanıttı ve negatif testi GEÇEMİYORDU. `button[data-copy]`
      # ve `[data-torch]` yalnızca dinleyiciyi kuran main.tsx'te var; dinleyici silinirse
      # tree-shaking bu literalleri de götürür → adım patlar.
      - name: Verify wired interactions (no dead controls)
        run: |
          node -e "
          const fs=require('fs');
          const js=fs.readdirSync('dist/assets').filter(f=>f.endsWith('.js'))
                     .map(f=>fs.readFileSync('dist/assets/'+f,'utf8')).join('');
          const probes=[
            ['button[data-copy]','alıntı kopyalama dinleyicisi'],
            ['[data-torch]','duvar feneri dinleyicisi'],
            ['vesika.nusha.v1','mühür / nüsha adası'],
            ['vesika.kazinti.v1','duvara kazı adası'],
          ];
          let bad=0;
          for (const [needle,label] of probes) {
            if (!js.includes(needle)) { console.error('Ölü kontrol — bağlanmamış: '+label); bad++; }
          }
          if (bad) process.exit(1);
          console.log('✓ '+probes.length+' etkileşim de dinleyicisiyle pakete girmiş');
          "

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
